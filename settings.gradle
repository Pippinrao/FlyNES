pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://storage.googleapis.com/download.flutter.io' }
    }
}
rootProject.name = "FlyNES"
include ':app'
// Generated module files are recreated by tools/flutter/Build-Android.ps1.
apply from: new File(settingsDir, 'ui/flutter/.android/include_flutter.groovy')
