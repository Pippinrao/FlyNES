name: flynes_ui
description: Shared Flutter presentation module for FlyNES.
publish_to: none

# This is an embedded module, not a separately versioned product.
# Production hosts derive their version from the repository VERSION file.
environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  module:
    androidX: true
    androidPackage: com.flynes.flynes_ui
    iosBundleIdentifier: com.flynes.flynesUi
